name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      api_built: ${{ steps.changes.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Detect changed paths
        id: changes
        # Read changed against latest image
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          BEFORE=$(docker inspect ghcr.io/${{ vars.REPOSITORY_NAME_LOWERCASE }}/api:latest --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$SHA" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -qE '^(internal|cmd|go\.mod|go\.sum|Dockerfile\.prod|docker-compose\.prod\.yaml)(/|$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.api == 'true'
        name: Build and push api
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ vars.REPOSITORY_NAME_LOWERCASE }}/api:latest
            ghcr.io/${{ vars.REPOSITORY_NAME_LOWERCASE }}/api:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    if: ${{ needs.build-and-push.outputs.api_built == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yaml
          target: /home/${{ secrets.SSH_USER }}/api

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export GITHUB_REPOSITORY=${{ vars.REPOSITORY_NAME_LOWERCASE }}
            cd /home/${{ secrets.SSH_USER }}/api
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d
            docker image prune -f