name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      api_built: ${{ steps.changes.outputs.api }}
      compose_changed: ${{ steps.changes.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Detect changed paths
        id: changes
        # Read changed against latest image
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          BEFORE=$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.revision"}}' docker://ghcr.io/${{ vars.REPOSITORY_NAME_LOWERCASE }}/api:deployed 2>/dev/null || echo "")
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$SHA" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "compose=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$SHA")
          if echo "$CHANGED" | grep -qE '^(internal|cmd|go\.mod|go\.sum|Dockerfile\.prod)(/|$)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^docker-compose\.prod\.yaml$'; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.api == 'true'
        name: Build and push api
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ vars.REPOSITORY_NAME_LOWERCASE }}/api:latest
            ghcr.io/${{ vars.REPOSITORY_NAME_LOWERCASE }}/api:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    if: ${{ needs.build-and-push.outputs.api_built == 'true' || needs.build-and-push.outputs.compose_changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yaml
          target: /home/${{ secrets.SSH_USER }}/api

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export REPOSITORY_NAME_LOWERCASE=${{ vars.REPOSITORY_NAME_LOWERCASE }}
            cd /home/${{ secrets.SSH_USER }}/api
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            MARKER=last_good_sha
            PREV_TAG=""
            [ -f "$MARKER" ] && PREV_TAG=$(cat "$MARKER")

            if [ "${{ needs.build-and-push.outputs.api_built }}" = "true" ]; then
              NEW_TAG="${{ github.event.workflow_run.head_sha }}"
            elif [ -n "$PREV_TAG" ]; then
              NEW_TAG="$PREV_TAG"
            else
              NEW_TAG="latest"
            fi

            export API_TAG="$NEW_TAG"
            docker compose -f docker-compose.prod.yaml pull
            if docker compose -f docker-compose.prod.yaml up -d --wait --wait-timeout 60; then
              echo "$NEW_TAG" > "$MARKER"
              docker tag "ghcr.io/${REPOSITORY_NAME_LOWERCASE}/api:$NEW_TAG" "ghcr.io/${REPOSITORY_NAME_LOWERCASE}/api:deployed"
              docker push "ghcr.io/${REPOSITORY_NAME_LOWERCASE}/api:deployed"
              docker image prune -f
            else
              echo "deploy of $NEW_TAG failed to become healthy"
              if [ -n "$PREV_TAG" ]; then
                echo "rolling back to $PREV_TAG"
                export API_TAG="$PREV_TAG"
                docker compose -f docker-compose.prod.yaml pull
                if docker compose -f docker-compose.prod.yaml up -d --wait --wait-timeout 60; then
                  echo "rollback to $PREV_TAG succeeded"
                else
                  echo "rollback to $PREV_TAG also failed to become healthy"
                fi
              else
                echo "no previous known-good tag to roll back to"
              fi
              exit 1
            fi
