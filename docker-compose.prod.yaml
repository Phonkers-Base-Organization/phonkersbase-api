services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY}/api:latest
    environment:
      PORT: 8080
      GIN_MODE: release
      DB_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    healthcheck:      
      test: ["CMD", "wget", "-qO-", "http://api:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traefik-public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.phonkersbase.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=myresolver"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
  
  postgres:
    image: postgres:17-alpine
    networks:
      - internal
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
networks:
  traefik-public:
    external: true
  internal:
